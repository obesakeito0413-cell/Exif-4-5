<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Frame EXIF</title><script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#2a2a2a;font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px #0001}h1{font-size:22px;margin:0 0 14px}label{display:block;font-weight:700;margin:13px 0 6px}input,select,button{font:inherit}input[type=text],input[type=number],select{width:100%;padding:12px;border:1px solid #ccc;border-radius:11px;background:#fff}input[type=color]{width:100%;height:46px;border:1px solid #ccc;border-radius:11px;padding:3px}.grid,.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg button{padding:12px;border:0;border-radius:11px;background:#eee;font-weight:700}.primary{width:100%;padding:14px;border:0;border-radius:11px;background:#222;color:#fff;font-weight:700;margin-top:14px}.secondary{width:100%;padding:13px;border:0;border-radius:11px;background:#eee;font-weight:700;margin-top:8px}.hint,.status{font-size:13px;line-height:1.5;color:#666;margin-top:10px}canvas{display:block;width:100%;height:auto;background:#fff}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:15px}}</style></head><body><div class="wrap"><div class="card"><h1>Photo Frame EXIF</h1><label>写真</label><input id="file" type="file" accept="image/jpeg,image/jpg"><label>テンプレート比率</label><div class="seg"><button id="r34" type="button">3:4　3600×4800</button><button id="r45" type="button">4:5　4320×5400</button></div><label>1行目（カメラ名・題名・SOOCなど）</label><input id="line1" type="text"><label>2行目</label><input id="line2" type="text"><div class="grid"><div><label>撮影場所</label><input id="location" type="text"></div><div><label>撮影日時</label><input id="date" type="text"></div></div><label>焦点距離</label><input id="focal" type="text"><div class="grid"><div><label>F値</label><input id="fnumber" type="text"></div><div><label>シャッター速度</label><input id="shutter" type="text"></div></div><label>ISO</label><input id="iso" type="text"><div class="grid"><div><label>カメラ名・題名の文字サイズ</label><input id="size1" type="number" value="54"></div><div><label>その他の文字サイズ</label><input id="size2" type="number" value="38"></div></div><div class="grid"><div><label>カメラ名・題名の太さ</label><select id="weight1"><option value="400">標準</option><option value="500">やや太め</option><option value="600">太め</option><option value="700" selected>太字</option></select></div><div><label>その他の文字の太さ</label><select id="weight2"><option value="400" selected>標準</option><option value="500">やや太め</option><option value="600">太め</option><option value="700">太字</option></select></div></div><label>文字色</label><input id="textColor" type="color" value="#2A2A2A"><label>背景色</label><input id="bgColor" type="color" value="#FFFFFF"><button id="export" class="primary">JPEGを書き出す</button><button id="reset" class="secondary">リセット</button><div id="status" class="status">写真を選択するとEXIFを読み込みます。</div><div class="hint">縦横は自動判定。3:4（3600×4800）と4:5（4320×5400）を選択できます。写真の比率は維持し、左右の余白を均等にします。EXIFからModel、撮影日時、焦点距離、F値、シャッター速度、ISO、GPSを取得できる場合は自動入力。すべて編集可能です。メーカー名は表示せずModelをカメラ名として使用します。</div></div><div class="card"><canvas id="canvas"></canvas></div></div><script>
const $=id=>document.getElementById(id),c=$('canvas'),x=c.getContext('2d');let img=null,W=3600,H=4800,ratio='3:4',nw=0,nh=0;
function ratioSet(r){ratio=r;W=r==='3:4'?3600:4320;H=r==='3:4'?4800:5400;['r34','r45'].forEach(id=>$(id).style.cssText=$(id).id===(r==='3:4'?'r34':'r45')?'background:#222;color:#fff':'background:#eee;color:#222');draw()}
$('r34').onclick=()=>ratioSet('3:4');$('r45').onclick=()=>ratioSet('4:5');
function date(v){if(!v)return'';if(v instanceof Date){let p=n=>String(n).padStart(2,'0');return `${v.getFullYear()}.${p(v.getMonth()+1)}.${p(v.getDate())}  ${p(v.getHours())}:${p(v.getMinutes())}`}let m=String(v).match(/^(\d{4}):(\d\d):(\d\d)[ T](\d\d):(\d\d)/);return m?`${m[1]}.${m[2]}.${m[3]}  ${m[4]}:${m[5]}`:v}
function num(v){if(v==null)return null;if(typeof v==='number')return v;if(v.numerator&&v.denominator)return v.numerator/v.denominator;return Number(v)}
function exifF(v){let n=num(v);return isFinite(n)?`f/${n.toFixed(1).replace(/\.0$/,'')}`:''}function focal(v){let n=num(v);return isFinite(n)?`${n.toFixed(1).replace(/\.0$/,'')}mm`:''}function shutter(v){let n=num(v);if(!isFinite(n))return'';return n<1?`1/${Math.round(1/n)}s`:`${n.toFixed(1).replace(/\.0$/,'')}s`}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);img=new Image();img.onload=async()=>{nw=img.naturalWidth;nh=img.naturalHeight;URL.revokeObjectURL(u);try{let z=await exifr.parse(f,{pick:['Model','DateTimeOriginal','CreateDate','FNumber','ExposureTime','ISO','ISOSpeedRatings','FocalLength','latitude','longitude']})||{};$('line1').value=z.Model||'';$('line2').value='';$('date').value=date(z.DateTimeOriginal||z.CreateDate);$('focal').value=focal(z.FocalLength);$('fnumber').value=exifF(z.FNumber);$('shutter').value=shutter(z.ExposureTime);$('iso').value=z.ISO!=null?`ISO${z.ISO}`:(z.ISOSpeedRatings!=null?`ISO${z.ISOSpeedRatings}`:'');$('location').value=typeof z.latitude==='number'&&typeof z.longitude==='number'?`${z.latitude.toFixed(5)}, ${z.longitude.toFixed(5)}`:'';$('status').textContent='EXIFを読み込みました。必要なら編集できます。'}catch(err){$('status').textContent='EXIFを読み込めませんでした。文字欄は手入力できます。'}draw()};img.src=u};
['line1','line2','location','date','focal','fnumber','shutter','iso','size1','size2','weight1','weight2','textColor','bgColor'].forEach(id=>$(id).addEventListener('input',draw));
function draw(){c.width=W;c.height=H;x.fillStyle=$('bgColor').value;x.fillRect(0,0,W,H);if(!img)return;let inset=240,photoAreaW=W-inset*2,photoAreaH=H-inset-720,scale=Math.min(photoAreaW/nw,photoAreaH/nh),dw=nw*scale,dh=nh*scale,px=(W-dw)/2,py=inset;x.drawImage(img,px,py,dw,dh);let left=px,right=W-inset,top=py+dh+220;x.fillStyle=$('textColor').value;x.textBaseline='alphabetic';x.font=`${$('weight1').value} ${$('size1').value}px Inter,Arial,sans-serif`;x.fillText($('line1').value,left,top);let y=top+130;x.font=`${$('weight2').value} ${$('size2').value}px Inter,Arial,sans-serif`;let l2=$('line2').value;if(l2){x.fillText(l2,left,y);y+=72}x.fillText($('location').value,left,y);x.fillText($('date').value,left,y+72);let a=[$('focal').value,$('fnumber').value,$('shutter').value,$('iso').value].filter(Boolean),slot=(right-left)/Math.max(a.length,1);a.forEach((t,i)=>x.fillText(t,left+i*slot,y+72))}
$('export').onclick=()=>{if(!img){$('status').textContent='先に写真を選択してください。';return}c.toBlob(b=>{let a=document.createElement('a'),n=($('line1').value||'photo').replace(/[\\/:*?"<>|]/g,'_');a.download=`${n}_${ratio.replace(':','x')}.jpg`;a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},'image/jpeg',.95)};
$('reset').onclick=()=>{['line1','line2','location','date','focal','fnumber','shutter','iso'].forEach(id=>$(id).value='');$('size1').value=54;$('size2').value=38;$('weight1').value=700;$('weight2').value=400;$('textColor').value='#2A2A2A';$('bgColor').value='#FFFFFF';$('status').textContent='リセットしました。';draw()};ratioSet('3:4');
</script></body></html>
