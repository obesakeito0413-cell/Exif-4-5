<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写真テンプレート</title>
<style>
body{margin:0;background:#f2f2f2;color:#222;font-family:Inter,Arial,sans-serif}main{max-width:980px;margin:auto;padding:16px}.p{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 14px #0001}.drop{border:2px dashed #aaa;border-radius:13px;padding:24px;text-align:center;background:#fafafa;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}label{font-size:13px;color:#555}input,select,button{font:inherit}input[type=text],input[type=number],select{width:100%;margin-top:5px;padding:9px;border:1px solid #ccc;border-radius:9px;background:#fff}input[type=color]{width:100%;height:42px;margin-top:5px;padding:3px;border:1px solid #ccc;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 15px;background:#222;color:#fff}button.alt{background:#eee;color:#222}.hint{font-size:12px;color:#666;line-height:1.5;margin-top:10px}canvas{display:block;width:100%;max-width:760px;height:auto;margin:auto;box-shadow:0 4px 22px #0002}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="p"><h2>写真テンプレート</h2>
<div id="drop" class="drop">写真をここにドロップ<br>またはタップして選択</div><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<div class="grid">
<label>キャンバス比率<select id="ratio"><option value="34">3:4</option><option value="45">4:5</option></select></label>
<label>1行目（カメラ名・題名）<input id="title"></label>
<label>2行目（SOOC / EDITEDなど）<input id="sub" placeholder="表示しない場合は空欄"></label>
<label>撮影地<input id="place"></label><label>日時<input id="date"></label><label>焦点距離<input id="focal"></label><label>F値<input id="fnum"></label><label>シャッター<input id="shutter"></label><label>ISO<input id="iso"></label>
<label>文字サイズ<input id="size" type="number" value="54"></label><label>文字色<input id="color" type="color" value="#2A2A2A"></label><label>背景色<input id="bg" type="color" value="#FFFFFF"></label>
</div><div class="actions"><button id="save">JPEGを書き出す</button><button id="reset" class="alt">リセット</button></div>
<div id="status" class="hint"></div><div class="hint">縦横は自動判定。3:4＝縦3600×4800／横4800×3600、4:5＝縦4320×5400／横5400×4320。メーカー名は表示せずModelをカメラ名として入力します。GPSがあれば座標を入力します。文字欄はすべて編集できます。</div></div>
<div class="p"><canvas id="c"></canvas></div></main>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script><script>
const $=i=>document.getElementById(i),c=$("c"),x=c.getContext("2d");let im=null,ori="v";
const L={34:{v:{w:3600,h:4800,pw:3022,ph:4030,px:289,py:178},h:{w:4800,h:3600,pw:4030,ph:3022,px:385,py:289}},45:{v:{w:4320,h:5400,pw:3400,ph:4533,px:460,py:200},h:{w:5400,h:4320,pw:4533,ph:3400,px:583,py:460}}};
function draw(){if(!im)return;let q=L[$("ratio").value][ori];c.width=q.w;c.height=q.h;x.fillStyle=$("bg").value;x.fillRect(0,0,q.w,q.h);let s=Math.max(q.pw/im.width,q.ph/im.height),w=im.width*s,h=im.height*s;x.save();x.beginPath();x.rect(q.px,q.py,q.pw,q.ph);x.clip();x.drawImage(im,q.px+(q.pw-w)/2,q.py+(q.ph-h)/2,w,h);x.restore();let fs=+$("size").value||54,t=fs*1.18,l=q.px,r=q.px+q.pw,b=q.py+q.ph;x.fillStyle=$("color").value;x.textBaseline="alphabetic";x.font=t+"px Inter,Arial,sans-serif";x.fillText($("title").value,l,b+t+34);let sub=$("sub").value.trim(),o=0;if(sub){x.font=fs*.72+"px Inter,Arial,sans-serif";x.fillText(sub,l,b+t+82);o=35}x.font=fs+"px Inter,Arial,sans-serif";x.fillText($("place").value,l,b+t+105+o);x.fillText($("date").value,l,b+t+158+o);let a=[$("focal").value,$("fnum").value,$("shutter").value,$("iso").value].filter(Boolean);if(a.length){x.font=fs+"px Inter,Arial,sans-serif";let wds=a.map(v=>x.measureText(v).width),g=fs*2,total=wds.reduce((a,b)=>a+b,0)+g*(a.length-1),xx=r-total;if(xx<l){g=Math.max(fs*.6,(r-l-wds.reduce((a,b)=>a+b,0))/(a.length-1||1));xx=r-(wds.reduce((a,b)=>a+b,0)+g*(a.length-1))}a.forEach((v,i)=>{x.fillText(v,xx,b+t+132+o);xx+=wds[i]+g})}}
async function load(f){["title","sub","place","date","focal","fnum","shutter","iso"].forEach(i=>$(i).value="");$("status").textContent="EXIFを読み込んでいます…";try{let e=await exifr.parse(f,{pick:["Model","DateTimeOriginal","FocalLength","FNumber","ExposureTime","ISO","latitude","longitude"]});if(e){$("title").value=e.Model||"";if(e.DateTimeOriginal){let d=new Date(e.DateTimeOriginal);$("date").value=isNaN(d)?String(e.DateTimeOriginal).replace("T"," ").slice(0,16):d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0")+"  "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}if(e.FocalLength)$("focal").value=(Math.round(e.FocalLength*10)/10)+"mm";if(e.FNumber)$("fnum").value="f/"+(Math.round(e.FNumber*10)/10);if(e.ExposureTime)$("shutter").value=e.ExposureTime<1?"1/"+Math.round(1/e.ExposureTime)+"s":e.ExposureTime+"s";if(e.ISO)$("iso").value="ISO"+e.ISO;if(e.latitude!=null&&e.longitude!=null)$("place").value="GPS "+e.latitude.toFixed(5)+", "+e.longitude.toFixed(5)}}catch(e){console.error(e);$("status").textContent="EXIFを読み込めませんでした。写真自体は使用できます。";}let u=URL.createObjectURL(f);im=new Image();im.onload=()=>{ori=im.height>=im.width?"v":"h";draw();URL.revokeObjectURL(u)};im.src=u}
$("drop").onclick=()=>$("file").click();$("file").onchange=e=>e.target.files[0]&&load(e.target.files[0]);$("drop").ondragover=e=>e.preventDefault();$("drop").ondrop=e=>{e.preventDefault();e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};document.querySelectorAll("input,select").forEach(e=>e.oninput=draw);$("reset").onclick=()=>location.reload();$("save").onclick=()=>{
if(!im)return alert("写真を選択してください。");
let q=L[$("ratio").value][ori];
$("status").textContent="JPEGを作成しています…";
c.toBlob(blob=>{
 if(!blob){alert("JPEGの作成に失敗しました。");$("status").textContent="JPEGの作成に失敗しました。";return}
 let u=URL.createObjectURL(blob),a=document.createElement("a");
 a.download="photo-template-"+q.w+"x"+q.h+".jpg";a.href=u;
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(u),2000);
 $("status").textContent="JPEGを書き出しました。";
},"image/jpeg",.95);
};
</script></body></html>
